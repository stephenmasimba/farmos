name: farmos_mobile
description: FarmOS Mobile — Smart Farm Management for Android & iOS
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # HTTP client
  dio: ^5.4.3

  # Secure JWT storage
  flutter_secure_storage: ^9.0.0

  # Offline local database
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Charts / analytics
  fl_chart: ^0.68.0

  # Date / number formatting
  intl: ^0.19.0

  # Connectivity detection
  connectivity_plus: ^6.0.3

  # Typography
  google_fonts: ^6.1.0

  # Non-sensitive preferences
  shared_preferences: ^2.2.3

  # QR code scanner (inventory)
  mobile_scanner: ^5.1.1

  # Local push notifications
  flutter_local_notifications: ^17.2.2

  # Image caching
  cached_network_image: ^3.3.1

  # Value equality
  equatable: ^2.0.5

  # Logging
  logger: ^2.3.0

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
