<!DOCTYPE html>
<html>
<head>
<base href="/">
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=Edge">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="description" content="FarmOS Mobile">
<title>FarmOS Mobile</title>
<link rel="manifest" href="manifest.json">
</head>
<body>
<script>
  const serviceWorkerVersion = null;
</script>
<script src="flutter.js" defer></script>
<script>
  window.addEventListener('load', function () {
    if (!window._flutter) return;
    window._flutter.loader.loadEntrypoint({serviceWorker: {serviceWorkerVersion}})
      .then(function (engineInitializer) { return engineInitializer.initializeEngine(); })
      .then(function (appRunner) { return appRunner.runApp(); });
  });
</script>
</body>
</html>
