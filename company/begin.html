<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BEGIN TRUST &amp; ASSOCIATED ENTITIES</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: #0f172a;
      background:
        radial-gradient(1100px 520px at 10% -10%, rgba(212, 175, 55, 0.18), transparent 60%),
        radial-gradient(900px 520px at 110% 0%, rgba(10, 43, 30, 0.12), transparent 60%),
        #f6f7fb;
      line-height: 1.6;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: linear-gradient(180deg, rgba(10, 43, 30, 0.98), rgba(10, 43, 30, 0.92));
      border-bottom: 3px solid #d4af37;
      color: #f8fafc;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(10px);
    }
    .topbar-inner {
      max-width: 1220px;
      margin: 0 auto;
      padding: 14px 16px;
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    .brand {
      font-family: "Playfair Display", serif;
      font-weight: 700;
      letter-spacing: -0.4px;
      font-size: 18px;
      display: flex;
      gap: 8px;
      align-items: baseline;
    }
    .brand small {
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      font-weight: 500;
      opacity: 0.9;
      font-size: 12px;
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn {
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
      color: #f8fafc;
      padding: 8px 12px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      transition: transform 0.06s ease, background 0.12s ease;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.14); }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      background: #d4af37;
      border-color: #d4af37;
      color: #0a2b1e;
    }
    .btn-primary:hover { background: #f5c842; }
    .container {
      max-width: 1220px;
      margin: 0 auto;
      padding: 22px 16px 56px;
    }
    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 16px;
      align-items: start;
    }
    .panel {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      box-shadow: 0 12px 26px rgba(2, 6, 23, 0.08);
    }
    .sidebar {
      position: sticky;
      top: 86px;
      align-self: start;
      padding: 14px;
    }
    .sidebar-title {
      font-weight: 800;
      letter-spacing: 0.2px;
      color: #0a2b1e;
      font-size: 13px;
      margin-bottom: 10px;
    }
    .toc-search {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      font-size: 13px;
      outline: none;
      background: #fbfcfe;
    }
    .toc-search:focus {
      border-color: rgba(10, 43, 30, 0.35);
      box-shadow: 0 0 0 4px rgba(10, 43, 30, 0.08);
    }
    .toc {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: calc(100vh - 190px);
      overflow: auto;
      padding-right: 6px;
    }
    .toc a {
      display: block;
      padding: 8px 10px;
      border-radius: 12px;
      text-decoration: none;
      border: 1px solid transparent;
      color: #475569;
      font-size: 13px;
      font-weight: 650;
    }
    .toc a:hover {
      background: rgba(10, 43, 30, 0.06);
      color: #0a2b1e;
      border-color: rgba(10, 43, 30, 0.08);
    }
    .toc a[data-level="2"] { padding-left: 16px; }
    .toc a[data-level="3"] { padding-left: 26px; font-weight: 600; }
    .toc a[data-level="4"] { padding-left: 36px; font-weight: 560; }
    .content {
      padding: 18px;
    }
    .doc-header {
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 14px;
      margin-bottom: 16px;
    }
    .doc-kicker {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.2px;
      text-transform: uppercase;
      color: #475569;
    }
    .doc-title {
      font-family: "Playfair Display", serif;
      font-weight: 700;
      font-size: 34px;
      line-height: 1.15;
      letter-spacing: -0.6px;
      margin: 6px 0 0;
    }
    .doc-subtitle {
      margin: 6px 0 0;
      color: #475569;
      font-weight: 600;
    }
    .doc {
      padding: 0;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }
    .doc h1, .doc h2, .doc h3, .doc h4, .doc h5, .doc h6 {
      font-family: "Playfair Display", serif;
      margin: 18px 0 10px;
      line-height: 1.25;
      scroll-margin-top: 110px;
    }
    .doc h1 { font-size: 32px; }
    .doc h2 { font-size: 24px; }
    .doc h3 { font-size: 20px; }
    .doc p { margin: 10px 0; }
    .doc hr { border: none; border-top: 1px solid #e2e8f0; margin: 18px 0; }
    .doc code {
      background: #f1f5f9;
      padding: 2px 6px;
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 0.92em;
    }
    .doc pre {
      background: #0b1220;
      color: #e2e8f0;
      padding: 14px 16px;
      border-radius: 14px;
      overflow: auto;
      margin: 12px 0;
    }
    .doc pre code { background: transparent; padding: 0; color: inherit; }
    .doc ul, .doc ol { padding-left: 22px; margin: 10px 0; }
    .doc table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
      font-size: 14px;
    }
    .doc th, .doc td {
      border: 1px solid #e2e8f0;
      padding: 10px 10px;
      vertical-align: top;
      text-align: left;
    }
    .doc th { background: #f8fafc; font-weight: 700; }
    .status {
      margin-top: 10px;
      color: #475569;
      font-size: 12px;
    }
    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { position: static; top: auto; }
      .toc { max-height: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        BEGIN TRUST <small>Document Viewer</small>
      </div>
      <div class="actions">
        <button class="btn" id="reloadBtn" type="button">Reload</button>
        <button class="btn" id="printBtn" type="button">Print</button>
        <button class="btn btn-primary" id="downloadBtn" type="button">Download Markdown</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="layout">
      <aside class="sidebar panel" aria-label="Document contents">
        <div class="sidebar-title">Contents</div>
        <input id="tocSearch" class="toc-search" type="search" placeholder="Search headings" autocomplete="off" />
        <nav id="toc" class="toc"></nav>
      </aside>
      <section class="content panel">
        <div class="doc-header">
          <div class="doc-kicker">Document Viewer</div>
          <div class="doc-title">BEGIN TRUST &amp; Associated Entities</div>
          <div class="doc-subtitle">Corporate structure, agreements, governance and registration checklist</div>
        </div>
        <div id="markdownPre" class="doc">Loading document…</div>
        <div id="status" class="status"></div>
      </section>
    </div>
  </main>
  <script src="simple-front-fallback.js"></script>
  <script>
    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function sanitizeHref(href) {
      const raw = String(href || "").trim();
      if (raw.startsWith("#")) return raw;
      if (/^https?:\/\//i.test(raw)) return raw;
      return "#";
    }

    function slugify(text, used) {
      const base = String(text || "")
        .toLowerCase()
        .replace(/&amp;/g, "and")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "")
        .slice(0, 64) || "section";

      let slug = base;
      let i = 2;
      while (used.has(slug)) {
        slug = `${base}-${i}`;
        i += 1;
      }
      used.add(slug);
      return slug;
    }

    function renderInline(text) {
      let safeText = escapeHtml(text);
      safeText = safeText.replace(/`([^`]+)`/g, "<code>$1</code>");
      safeText = safeText.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      safeText = safeText.replace(/__([^_]+)__/g, "<strong>$1</strong>");
      safeText = safeText.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      safeText = safeText.replace(/_([^_]+)_/g, "<em>$1</em>");
      safeText = safeText.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, href) => {
        const safeHref = sanitizeHref(href);
        const target = safeHref.startsWith("#") ? "_self" : "_blank";
        return `<a href="${escapeHtml(safeHref)}" target="${target}" rel="noopener noreferrer">${label}</a>`;
      });
      return safeText;
    }

    function parseTableRow(line) {
      return line
        .trim()
        .replace(/^\||\|$/g, "")
        .split("|")
        .map((cell) => cell.trim());
    }

    function flushList(html, listType, listItems) {
      if (!listType || listItems.length === 0) return;
      const tag = listType === "ol" ? "ol" : "ul";
      html.push(`<${tag}>${listItems.map((item) => `<li>${item}</li>`).join("")}</${tag}>`);
    }

    function flushTable(html, tableRows) {
      if (tableRows.length < 2) {
        tableRows.forEach((row) => html.push(`<p>${renderInline(row)}</p>`));
        return;
      }

      const headerLine = tableRows[0];
      const separatorLine = tableRows[1];
      if (!/^\s*\|?\s*:?[-]+:?(\s*\|\s*:?[-]+:?)+\s*\|?\s*$/.test(separatorLine)) {
        tableRows.forEach((row) => html.push(`<p>${renderInline(row)}</p>`));
        return;
      }

      const headers = parseTableRow(headerLine);
      const bodyRows = tableRows.slice(2).map(parseTableRow);
      html.push(
        `<table><thead><tr>${headers.map((cell) => `<th>${renderInline(cell)}</th>`).join("")}</tr></thead><tbody>${bodyRows
          .map((row) => `<tr>${row.map((cell) => `<td>${renderInline(cell)}</td>`).join("")}</tr>`)
          .join("")}</tbody></table>`,
      );
    }

    function parseMarkdown(text) {
      const usedSlugs = new Set();
      const tocItems = [];
      const lines = String(text).split(/\r?\n/);
      const html = [];
      let inCode = false;
      let codeLines = [];
      let listType = null;
      let listItems = [];
      let tableRows = [];

      const flushPending = () => {
        if (inCode) {
          html.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
          inCode = false;
          codeLines = [];
        }
        if (listType) {
          flushList(html, listType, listItems);
          listType = null;
          listItems = [];
        }
        if (tableRows.length > 0) {
          flushTable(html, tableRows);
          tableRows = [];
        }
      };

      lines.forEach((line) => {
        if (/^```/.test(line)) {
          if (inCode) {
            flushPending();
          } else {
            flushPending();
            inCode = true;
          }
          return;
        }

        if (inCode) {
          codeLines.push(line);
          return;
        }

        const trimmed = line.trim();
        if (trimmed === "") {
          flushPending();
          return;
        }

        const headingMatch = trimmed.match(/^(#{1,6})\s+(.*)$/);
        if (headingMatch) {
          flushPending();
          const level = headingMatch[1].length;
          const headingText = headingMatch[2].trim();
          const id = slugify(headingText, usedSlugs);
          html.push(`<h${level} id="${id}">${renderInline(headingText)}</h${level}>`);
          if (level <= 4) tocItems.push({ level, id, text: headingText });
          return;
        }

        if (/^---+$/.test(trimmed)) {
          flushPending();
          html.push("<hr />");
          return;
        }

        const listMatch = trimmed.match(/^([-*+])\s+(.*)$/);
        if (listMatch) {
          const newType = "ul";
          if (tableRows.length > 0) {
            flushTable(html, tableRows);
            tableRows = [];
          }
          if (listType !== newType) {
            flushList(html, listType, listItems);
            listType = newType;
            listItems = [];
          }
          listItems.push(renderInline(listMatch[2]));
          return;
        }

        const orderedMatch = trimmed.match(/^(\d+)\.\s+(.*)$/);
        if (orderedMatch) {
          const newType = "ol";
          if (tableRows.length > 0) {
            flushTable(html, tableRows);
            tableRows = [];
          }
          if (listType !== newType) {
            flushList(html, listType, listItems);
            listType = newType;
            listItems = [];
          }
          listItems.push(renderInline(orderedMatch[2]));
          return;
        }

        if (trimmed.includes("|")) {
          if (listType) {
            flushList(html, listType, listItems);
            listType = null;
            listItems = [];
          }
          tableRows.push(line);
          return;
        }

        if (tableRows.length > 0) {
          flushTable(html, tableRows);
          tableRows = [];
        }

        flushPending();
        html.push(`<p>${renderInline(trimmed)}</p>`);
      });

      flushPending();
      return { html: html.join(""), toc: tocItems };
    }

    function loadMarkdownDocument() {
      const container = document.getElementById("markdownPre");
      const status = document.getElementById("status");
      if (!container) return;
      const started = Date.now();

      const text = typeof SIMPLE_FRONT_MARKDOWN === "string" ? SIMPLE_FRONT_MARKDOWN : "";
      if (!text) {
        container.textContent = "Document content missing. Ensure simple-front-fallback.js is present next to begin.html.";
        if (status) status.textContent = "Missing SIMPLE_FRONT_MARKDOWN.";
        return null;
      }

      const parsed = parseMarkdown(text);
      container.innerHTML = parsed.html;

      const toc = document.getElementById("toc");
      if (toc) {
        toc.innerHTML = parsed.toc
          .map((h) => `<a href="#${escapeHtml(h.id)}" data-level="${h.level}">${escapeHtml(h.text)}</a>`)
          .join("");
      }

      const search = document.getElementById("tocSearch");
      if (search && toc && !search.dataset.wired) {
        search.dataset.wired = "1";
        search.addEventListener("input", () => {
          const q = String(search.value || "").trim().toLowerCase();
          toc.querySelectorAll("a").forEach((a) => {
            const t = String(a.textContent || "").toLowerCase();
            a.style.display = q === "" || t.includes(q) ? "block" : "none";
          });
        });
      }

      if (status) status.textContent = `Loaded ${text.length.toLocaleString()} chars in ${Date.now() - started} ms.`;
      return text;
    }

    let lastMarkdownText = null;

    document.getElementById("reloadBtn")?.addEventListener("click", () => {
      lastMarkdownText = loadMarkdownDocument();
    });
    document.getElementById("printBtn")?.addEventListener("click", () => window.print());
    document.getElementById("downloadBtn")?.addEventListener("click", () => {
      if (!lastMarkdownText) lastMarkdownText = loadMarkdownDocument();
      if (!lastMarkdownText) return;
      const blob = new Blob([lastMarkdownText], { type: "text/markdown;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "simple-front.md";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    lastMarkdownText = loadMarkdownDocument();
  </script>
</body>
</html>
